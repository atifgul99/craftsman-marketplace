  <text x="76" y="157" fill="#F2F7F4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="33" font-weight="700">Climb sequence</text>
  <text x="76" y="191" fill="#9CBAB1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">The few things that matter first — consequence before jargon.</text>
