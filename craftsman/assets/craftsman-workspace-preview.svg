<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Craftsman audit workspace preview</title>
  <desc id="desc">A schematic report showing a prioritized climb sequence and readiness grades.</desc>
  <rect width="1200" height="630" fill="#0D1F1D"/>
  <rect x="36" y="36" width="1128" height="558" rx="22" fill="#112B27" stroke="#31584F" stroke-width="2"/>
  <rect x="36" y="36" width="1128" height="68" rx="22" fill="#183A34"/>
  <circle cx="76" cy="70" r="9" fill="#F87171"/><circle cx="104" cy="70" r="9" fill="#FBBF24"/><circle cx="132" cy="70" r="9" fill="#6EE7B7"/>
