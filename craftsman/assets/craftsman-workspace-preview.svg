  <text x="98" y="257" fill="#9CBAB1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">#</text><text x="140" y="257" fill="#9CBAB1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">FINDING</text><text x="785" y="257" fill="#9CBAB1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">SEVERITY</text><text x="957" y="257" fill="#9CBAB1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">STATUS</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">
    <rect x="76" y="287" width="1048" height="57" rx="9" fill="#163630"/><text x="98" y="322" fill="#D6E8DD">1</text><text x="140" y="322" fill="#F2F7F4">Anyone can access another customer's invoice</text><text x="785" y="322" fill="#F87171">Critical</text><text x="957" y="322" fill="#FBBF24">Open</text>
    <rect x="76" y="354" width="1048" height="57" rx="9" fill="#163630"/><text x="98" y="389" fill="#D6E8DD">2</text><text x="140" y="389" fill="#F2F7F4">The database does not enforce tenant separation</text><text x="785" y="389" fill="#F87171">Critical</text><text x="957" y="389" fill="#FBBF24">Open</text>
    <rect x="76" y="421" width="1048" height="57" rx="9" fill="#163630"/><text x="98" y="456" fill="#D6E8DD">3</text><text x="140" y="456" fill="#F2F7F4">The money path has no regression test</text><text x="785" y="456" fill="#FBBF24">High</text><text x="957" y="456" fill="#FBBF24">Open</text>
  </g>
  <rect x="76" y="510" width="1048" height="52" rx="12" fill="#253B36"/>
  <text x="98" y="543" fill="#D6E8DD" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">Overall readiness</text>
